services:
  mysql:
    image: mariadb:13.0
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PW:-root}"
      MYSQL_DATABASE: "test"
      MYSQL_USER: "${DB_USER:-test}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-test}"
      TZ: "Europe/Berlin"

  php:
    image: ghcr.io/elbformat/sulu-behat-bundle/php:8.4
    working_dir: /var/www
#    environment:
#      DATABASE_URL: 'mysql://test:test@mysql:3306/test?serverVersion=mariadb-10.6.15'
#      ELASTICSEARCH_HOST: 'elasticsearch:9200'
#      MAILER_DSN: 'null://localhost'
    volumes:
      - ./:/var/www
